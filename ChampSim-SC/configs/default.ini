# Every compile-time choice lives here. With no arguments, this file builds a
# plain baseline with no STLB prefetcher. Copy it, edit the values, then run:
# ./generate_binary.sh path/to/my-config.ini

[build]
branch_predictor = hashed_perceptron
l1i_prefetcher = next_line
l1d_prefetcher = next_line
l2c_prefetcher = spp_dev
llc_prefetcher = no
llc_replacement = lru
cores = 1
stlb_prefetcher = no
name_suffix =

[simulator]
page_size = 4kb
stlb_sets = 256
stlb_assoc = 6
stlb_latency = 8
pq_size = 64
prefetch_to_tlb = 0
free_prefetching = 0
free_prefetching_prefetch = 0
asap = 0
ideal = 0
pc_table = 128
pc_table_assoc = 128
markov_sets = 256
markov_assoc = 256
lookahead_depth = 0
successors = 2
reset_frequency = 5000
replacement_policy = 0
successor_replacement_policy = 0
lookahead_limit = 5
confidence_bits = 3
bp_filter = 0

[morrigan]
# These values are ignored unless a Morrigan-family STLB prefetcher is selected.
s1_sets = 128
s1_assoc = 32
s2_sets = 128
s2_assoc = 32
s4_sets = 128
s4_assoc = 32
s8_sets = 64
s8_assoc = 16

[tage]
# These values are ignored unless stlb_prefetcher = morriganPT_tage2.
h2_sets = 1024
h2_assoc = 4
h4_sets = 1024
h4_assoc = 4
h8_sets = 1024
h8_assoc = 4
allocation_policy = 1
usefulness_bit = 1
usefulness_reset = 65536
delta_history = 0
confidence_threshold = 1
